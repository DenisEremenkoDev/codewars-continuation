<body>
<script>





    const number = (busStops) => {
        return busStops.reduce((totalPeople, currentStop) => {
            const peopleIn = currentStop[0]; // вошли
            const peopleOut = currentStop[1]; // вышли

            return totalPeople + peopleIn - peopleOut;
        }, 0);
    }

</script>

<!--Ваша задача — найти количество людей, оставшихся в автобусе после последней остановки (после последнего массива). Несмотря на то, что это последняя остановка, автобус может быть не пустым, и некоторые люди могут всё ещё оставаться внутри, вероятно, они там спят :D-->
