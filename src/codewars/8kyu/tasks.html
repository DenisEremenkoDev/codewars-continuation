<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>

    const betterThanAverage = (classPoints, yourPoints) => {
        let sum = 0;
        let calculation = 0;

        for (let i = 0; i < classPoints.length; i += 1) {
            sum = sum + classPoints[i] // складываем все числа
        }
        calculation = sum / classPoints.length
       return  Math.round(calculation) < yourPoints ? true : false
    }


    console.log(betterThanAverage([12, 23, 34, 45, 56, 67, 78, 89, 90], 9))

</script>
</body>
</html>
